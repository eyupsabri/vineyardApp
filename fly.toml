app = 'vineyardapp'
primary_region = 'ams'

[deploy]
  auto_stop_machines  = "off"
  auto_start_machines = false

[build]

[http_service]
  internal_port       = 80
  force_https         = true
  auto_stop_machines  = "off"    # ← turn off idle shutdown
  auto_start_machines = false    # ← don’t spin up on HTTP
  min_machines_running = 1       # ← keep at least one VM alive
  processes           = ["app"]

[[vm]]
  memory   = "1gb"
  cpu_kind = "shared"
  cpus     = 1